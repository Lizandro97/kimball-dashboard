services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superstore
      POSTGRES_PASSWORD: superstore
      POSTGRES_DB: superstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superstore -d superstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://superstore:superstore@db:5432/superstore
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: